name = "cobalt_calibration"
problem = "Calibrate a high-purity germanium detector with a 60Co source.\n\nThe digitized spectrum contains two full-energy peaks from the 60Co decay:\n1173.2 keV and 1332.5 keV, recorded with a detector whose energy\ncalibration is unknown.\n\nTask:\n1. Generate a synthetic spectrum: two Gaussian peaks with centroids\n   1173.2 and 1332.5 keV, sigma 5 keV each, areas 100000 and 110000\n   counts, sitting on a flat background of 2 counts per channel, on a\n   4096-channel energy axis with 0.5 keV per channel. Save the histogram\n   (ROOT TH1D in spectrum.root if ROOT is available, otherwise a CSV\n   with energy,counts columns in spectrum.csv).\n2. Fit both peaks (Gaussian + constant background).\n3. Write the extracted values to RESULTS.txt, one `key = value` line each:\n   peak1_energy, peak1_sigma, peak1_area, peak2_energy, peak2_sigma,\n   peak2_area.\nRun your analysis code, check that the fit converged, and iterate until\nthe residuals look flat. Record the final values in RESULTS.txt.\n"

[[checks]]
id = "peak1_energy"
key = "peak1_energy"
expected = 1173.2
tolerance = 2.0

[[checks]]
id = "peak1_sigma"
key = "peak1_sigma"
expected = 5.0
tolerance = 1.0

[[checks]]
id = "peak1_area"
key = "peak1_area"
expected = 100000.0
tolerance = 10000.0

[[checks]]
id = "peak2_energy"
key = "peak2_energy"
expected = 1332.5
tolerance = 2.0

[[checks]]
id = "peak2_sigma"
key = "peak2_sigma"
expected = 5.0
tolerance = 1.0

[[checks]]
id = "peak2_area"
key = "peak2_area"
expected = 110000.0
tolerance = 10000.0
