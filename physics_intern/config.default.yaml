# Physics mode default configuration
# This is the single source of truth for all default values.
# Do NOT hardcode defaults in Python — they are read from this file.

model: ""
# Ceiling on the Autophysicist outer loop. `problem run --max-iterations`
# and physics.max_iterations in config.yaml override it.
max_iterations: 50
max_tokens: 8192
api_retry_max: 10
api_retry_initial_delay: 10.0
api_retry_max_delay: 60.0
api_timeout: 2400.0

# --- One-shot parse retry ---
# Max continuation retries on missing/invalid JSON output.
# Applies only to parse failures — truncation retries are governed by
# max_tokens_retries below.
parse_retries: 2

# --- Max-tokens continuation retry ---
# Max continuation attempts when a response is truncated because it hit its
# output token limit. The helper resends the visible-text portion of the
# truncated response as an assistant turn and asks the model to continue
# from where it stopped.
max_tokens_retries: 2

# --- Per-agent max output tokens ---
# Override the model-level max_output_tokens for specific roles. Roles not
# listed here use the model-level default. Keys match the agent name exactly,
# or as a prefix (so every "subagent_iter3_2" style name picks up the
# "subagent" entry).
agent_max_tokens:
  manager: 32768
  # Without this the Research Manager and its sub-agents fall back to the
  # 8192 model-level default, which a reasoning model can spend entirely on
  # reasoning before writing a single visible token.
  #
  # 24576, not 65536: a sub-agent writes ONE self-contained script, and the
  # scripts that come back are 13-19 KB. Given 64k it used 40-55k per call
  # and took nine to twenty minutes, because a budget that large is an
  # invitation to keep going. If a task genuinely needs more than this, it
  # is too big for one sub-agent and the Manager should split it.
  subagent: 24576
  critic: 16384
  spec_writer: 16384

# --- Autophysicist critic ---
# Review each iteration from outside before the next one starts.
# 1 = every iteration, 0 = off.
critique_every_n: 1
