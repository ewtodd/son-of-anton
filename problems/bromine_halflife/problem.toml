name = "bromine_halflife"
problem = "Measure the half-life of 78mBr by decay curve fitting.\n\nA source of 78mBr (true half-life 119.2 seconds) was counted in\nconsecutive 5-second time bins. The data obey\n\n    N(t) = N0 * exp(-t / tau) + B\n\nwith N0 = 50000 counts in the first bin, tau = 172.0 seconds (the\nhalf-life divided by ln(2)), and a constant background B = 200 counts\nper bin. Poisson noise is applied per bin.\n\nTask:\n1. Generate the decay data for t = 0 to 600 s in 5 s bins (write it to\n   decay.csv with columns t,counts, and also to decay.root as a TGraph\n   if ROOT is available).\n2. Fit N(t) = N0 * exp(-t / tau) + B (three free parameters).\n3. Write to RESULTS.txt, one `key = value` line each:\n   tau_fit, halflife_s, N0_fit, B_fit\n   where halflife_s = tau_fit * ln(2).\nRun the fit, examine the covariance matrix and chi2, and iterate if the\nfit is poor. Record the final values in RESULTS.txt.\n"

[[checks]]
id = "halflife"
key = "halflife_s"
expected = 119.2
tolerance = 4.0

[[checks]]
id = "tau"
key = "tau_fit"
expected = 172.0
tolerance = 6.0

[[checks]]
id = "background"
key = "B_fit"
expected = 200.0
tolerance = 30.0
