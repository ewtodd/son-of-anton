

[project]
name = "son-of-anton"
version = "0.4.0"
description = "Always-on agent harness with physics research modes (hard fork of Nous Research's hermes-agent)"
readme = "README.md"
# Upper bound is load-bearing, not cosmetic. uv resolves the project's
# Python from `requires-python`, and an inherited `UV_PYTHON` env var (or a
# fresh distro whose newest interpreter uv auto-picks) will otherwise select
# 3.14, where Rust-backed transitives (e.g. pydantic-core) have no cp314
# wheel yet and fall back to a maturin source build that fails. Capping at
# <3.14 makes uv refuse 3.14 with a clear error instead of attempting that
# build. Raise the ceiling once our Rust transitives ship cp314 wheels.
requires-python = ">=3.11,<3.14"
authors = [{ name = "Nous Research" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  # Every direct dep is exact-pinned: a new version reaches the venv only
  # through a reviewed pin bump plus `uv lock` (supply-chain policy since the
  # 2026-05 PyPI worm). The Nix module is the only install path.
  "openai==2.24.0",
  "certifi==2026.5.20",
  "python-dotenv==1.2.2",
  "httpx==0.28.1",
  "rich==14.3.3",
  "requests==2.33.0",  # CVE-2026-25645
  "croniter==6.0.0",
  "textual==8.2.8",
  # The TUI feed parses markdown itself (son_of_anton_tui/feed.py).
  "markdown-it-py==4.0.0",
  "psutil==7.2.2",
  "ptyprocess>=0.7.0,<1",
  # Vision tools and compaction shrink oversized images before embedding them.
  "Pillow==12.3.0",
  "mcp==2.0.0",
  "httpx2==2.7.0",
  # Security floors for transitive deps (requests, mcp, mcp -> pyjwt[crypto]).
  "urllib3>=2.7.0,<3",  # GHSA-mf9v-mfxr-j63j, GHSA-qccp-gfcp-xxvc
  "starlette==1.3.1",  # CVE-2026-48710
  "cryptography==50.0.0",  # CVE-2026-69247, GHSA-m2h6-j472-rp4c, GHSA-jwv3-5hgf-82ww, CVE-2026-39892, CVE-2026-34073, GHSA-537c-gmf6-5ccf
]

[project.optional-dependencies]
dev = ["debugpy==1.8.20", "pytest==9.1.1", "pytest-asyncio==1.3.0", "ty==0.0.21", "ruff==0.15.10", "setuptools==83.0.0"]  # setuptools: 83 (torch >=2.13 requires setuptools 83)

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
son-of-anton = "son_of_anton_cli.main:main"

[tool.uv]
exclude-newer = "14 days"
# setuptools, pillow, mcp, cryptography: exact pins, so exclude-newer adds no
# float protection, while a resolver that cannot see an upload date (old uv,
# mirror index, stale HTTP cache) would filter the pinned version and fail to
# resolve or build at all.
exclude-newer-package = { setuptools = false, pillow = false, mcp = false, cryptography = false }

[tool.setuptools]
# Top-level single-file modules (not packages). Without this, uv2nix's
# sealed venv is missing son_of_anton_constants, run_agent, etc.
py-modules = [
  "run_agent",
  "registration_lifecycle",
  "model_tools",
  "toolsets",
  "cli",
  "mcp_serve",
  "son_of_anton_constants",
  "son_of_anton_state",
  "son_of_anton_state_common",
  "son_of_anton_state_portability",
  "son_of_anton_state_schema",
  "son_of_anton_state_search",
  "son_of_anton_time",
  "son_of_anton_logging",
  "utils",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "son_of_anton_cli", "son_of_anton_cli.*", "gateway", "gateway.*", "cron", "cron.*", "autophysicist", "autophysicist.*", "son_of_anton_tui", "son_of_anton_tui.*"]

[tool.setuptools.package-data]
# Globs, not an enumeration of filenames. Every prompt here is loaded at
# runtime with `Path(__file__).parent / "<name>.md"`, so one omitted from this
# list is not a build error — it is a FileNotFoundError in a sealed install
# only, at the moment that agent first runs. That has now happened twice.
# tests/test_physics_package_data.py enforces the match.
autophysicist = ["config.default.toml", "*.toml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "linux_only: exercises Linux-specific behaviour; skipped on other hosts",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true  # required for PLW1514 (unspecified-encoding) — preview rule

[tool.ruff.lint]
# All other lints are intentionally disabled (see comment history on this
# file) while we wrangle typechecks — but PLW1514 is too load-bearing to
# keep off.  Bare open()/read_text()/write_text() in text mode defaults to
# the system locale encoding on Windows (cp1252 on US-locale installs),
# which silently corrupts any non-ASCII file content.  We had three
# separate Windows sandbox regressions in one debug session before
# adding the explicit encoding.  This rule keeps new code honest.
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]
# Plugins are partially user-authored — their own conventions.
